# Builds the Linux x86_64 preview packages (deb, rpm, AppImage) on a native amd64 runner. Manual start only: the
# owner starts it with `gh workflow run linux-packages.yml -f version=<version>` and attaches the result to the release
# by hand. It never publishes, never signs and never runs on a push or a pull request.
name: linux-packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to build, equal to the version in app/src-tauri/tauri.conf.json
        required: true
        type: string

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, inspect and checksum the packages
        env:
          VERSION: ${{ inputs.version }}
        run: sh scripts/release-linux-container.sh "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: holzWave-linux-packages
          path: target/release-cross/holzWave_*
          if-no-files-found: error
          retention-days: 7
