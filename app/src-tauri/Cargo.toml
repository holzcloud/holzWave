[package]
name = "holzwave-app"
description = "The holzWave app shell (Tauri)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "holzwave_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "3.0.0-alpha.4", features = [] }

[dependencies]
holzwave-core = { path = "../../core" }
holzwave-host = { path = "../../host" }
holzwave-ipc = { path = "../../ipc" }
tauri = { version = "3.0.0-alpha.5", features = [] }
tauri-runtime-wry = "3.0.0-alpha.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The operating system's keychain (macOS Keychain, Windows Credential Manager, Secret Service). Android has no backend for the
# keyring crate, so it never builds one: the Android host keeps its own store (src/android/host.rs). Cargo adds the feature to
# the dependency above on every other target.
[target.'cfg(not(target_os = "android"))'.dependencies]
holzwave-core = { path = "../../core", features = ["keyring"] }

# The platform certificate verifier of Android (src/android/tls.rs): its Rust half needs a JNI environment of the same crate
# version the Kotlin component is called through, so the app names `jni` to hand it the Android context once. The version is the one
# the lock file already holds for the verifier, pinned with `=` like every other direct dependency; the table is Android only, so
# no other platform compiles or locks it differently. No TLS code of ours: the verifier is the one rustls already uses.
[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.22.4"

# The on-device model of macOS. The table is macOS only, so Windows, Linux and mobile builds (iOS is another target OS) never
# compile Swift. The crate links Apple's framework weakly, and a library crate's link arguments do not reach the crates that
# depend on it, so the build script of this crate repeats them (build.rs).
[target.'cfg(target_os = "macos")'.dependencies]
holzwave-apple-ai = { path = "../../plugins/apple-ai" }
# The Local Network privacy probe of macOS (local_network.rs): a Swift package behind a C ABI of two integer functions. It uses
# the Network framework and the Swift runtime that the apple-ai crate's run path already covers.
holzwave-local-network = { path = "../../plugins/local-network" }

# The system pasteboard of macOS, read and written in process (clipboard.rs). All three crates are in the lock file already,
# through tao and muda; they are named here so the app can call them directly, pinned with `=` like every other direct
# dependency. No Tauri plugin is involved (core/tests/project_policy.rs refuses them).
objc2 = { version = "=0.6.5", default-features = false, features = ["std"] }
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString"] }
