<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3200 800" width="3200" height="800">
 <!--
  The holzWave README banner (holzcloud project banner layout): the logo, the name,
  the tagline and tags at the left, a terminal window at the right (the session shown is an illustration).
  assets/brand/banner.png is rendered from this file at 3200x800 with Chromium by
  assets/brand/render-banner.js, which turns the screen group (#screen-tilt) towards the text;
  the PNG uses Plus Jakarta Sans (SIL Open Font License 1.1), which is not committed.
 -->
 <defs>
  <radialGradient id="glow" cx="300" cy="80" r="1500" gradientUnits="userSpaceOnUse">
   <stop offset="0" stop-color="#40183F"/>
   <stop offset="0.55" stop-color="#14091A"/>
  </radialGradient>
  <radialGradient id="screen-glow" cx="2500" cy="420" r="900" gradientUnits="userSpaceOnUse">
   <stop offset="0" stop-color="#4A1A47" stop-opacity="0.8"/>
   <stop offset="1" stop-color="#14091A" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="desktop" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0" stop-color="#A8416F"/>
   <stop offset="1" stop-color="#6B2B63"/>
  </linearGradient>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.55"/></filter>
  <filter id="win-shadow" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#2A0A24" flood-opacity="0.6"/></filter>
  <filter id="tile-shadow" x="-15%" y="-15%" width="130%" height="135%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.45"/></filter>
  <clipPath id="screen"><rect x="1954" y="64" width="1064" height="682" rx="30"/></clipPath>
  <style>
   text { font-family: 'Plus Jakarta Sans', 'Inter', 'Helvetica Neue', Arial, sans-serif; }
   .title { font-size: 156px; font-weight: 600; letter-spacing: -2px; }
   .tagline { font-size: 46px; font-weight: 400; }
   .tag { font-size: 32px; font-weight: 500; }
   .mono { font-family: 'JetBrains Mono', Menlo, 'SF Mono', Consolas, monospace; font-size: 30px; font-weight: 500; }
   .tab { font-size: 26px; font-weight: 600; }
  </style>
 </defs>

 <!-- background -->
 <rect width="3200" height="800" fill="#14091A"/>
 <rect width="3200" height="800" fill="url(#glow)"/>
 <rect width="3200" height="800" fill="url(#screen-glow)"/>

 <!-- logo tile (assets/brand/holzWave.svg, scaled to 200 px) -->
 <g filter="url(#tile-shadow)" transform="translate(135.73 85.73) scale(0.24272)">
   <defs>
   <clipPath id="logo-plank"><rect x="207" y="702" width="610" height="107" rx="37"/></clipPath>
   </defs>
   <rect x="100" y="100" width="824" height="824" rx="185" fill="#14091A"/>
   <rect x="207" y="702" width="610" height="107" rx="37" fill="#C98B4F"/>
   <rect x="207" y="702" width="610" height="25" rx="12" fill="#E0A869" opacity="0.7" clip-path="url(#logo-plank)"/>
   <g fill="none" stroke="#9B6534" stroke-linecap="round">
   <path d="M265 759 C388 743 545 780 759 755" stroke-width="10.7"/>
   <path d="M339 784 C446 772 586 792 677 780" stroke-width="8" opacity="0.7"/>
   <ellipse cx="594" cy="751" rx="25" ry="12" stroke-width="8"/>
   </g>
   <path d="M259 490 C326.5 490 360.2 436 427.7 436 C495.1 436 528.9 490 596.3 490 C663.8 490 697.5 436 765.0 436 L765 436 L765 626 a44 44 0 0 1 -44 44 L303 670 a44 44 0 0 1 -44 -44 Z" fill="#FFE6F0" stroke="#FFE6F0" stroke-width="24" stroke-linejoin="round"/>
   <path d="M259 524 C326.5 524 360.2 470 427.7 470 C495.1 470 528.9 524 596.3 524 C663.8 524 697.5 470 765.0 470" fill="none" stroke="#FFC2DA" stroke-width="14" stroke-linecap="butt"/>
   <path d="M345 545 L405 590 L345 635" fill="none" stroke="#C23B72" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
   <rect x="455" y="577" width="110" height="28" rx="14" fill="#C23B72"/>
   <path d="M760 306 l12 33 33 12 -33 12 -12 33 -12 -33 -33 -12 33 -12z" fill="#FFFFFF"/>
 </g>

 <!-- name and tagline -->
 <text x="404" y="262" class="title" fill="#F6EFE6">holzWave</text>
 <text x="160" y="410" class="tagline" fill="#D9C9D6">A terminal for every screen —</text>
 <text x="160" y="468" class="tagline" fill="#D9C9D6">macOS, Windows, Linux, iOS and Android.</text>

 <!-- tags -->
  <rect x="160" y="520" width="278" height="72" rx="36" fill="#FF8FB8"/>
  <text x="299" y="567" text-anchor="middle" class="tag" fill="#14091A">Pre-alpha</text>
  <rect x="461.5" y="521.5" width="199" height="69" rx="34.5" fill="#2A1226" stroke="#8D3F63" stroke-width="3"/>
  <text x="561" y="567" text-anchor="middle" class="tag" fill="#FF8FB8">GPL-3.0</text>
  <rect x="685.5" y="521.5" width="290" height="69" rx="34.5" fill="#2A1226" stroke="#8D3F63" stroke-width="3"/>
  <text x="830.5" y="567" text-anchor="middle" class="tag" fill="#FF8FB8">Rust + Tauri</text>
 <!-- principles -->
  <rect x="161.5" y="613.5" width="304" height="69" rx="34.5" fill="#1E0E1F" stroke="#4A2A47" stroke-width="3"/>
  <text x="313.5" y="659" text-anchor="middle" class="tag" fill="#D9C9D6">Block tiling</text>
  <rect x="490.5" y="613.5" width="354" height="69" rx="34.5" fill="#1E0E1F" stroke="#4A2A47" stroke-width="3"/>
  <text x="667.5" y="659" text-anchor="middle" class="tag" fill="#D9C9D6">Your own sync</text>
  <rect x="869.5" y="613.5" width="402" height="69" rx="34.5" fill="#1E0E1F" stroke="#4A2A47" stroke-width="3"/>
  <text x="1070.5" y="659" text-anchor="middle" class="tag" fill="#D9C9D6">AI only with consent</text>

 <!-- screen; render-banner.js turns it towards the text in 3D -->
 <g id="screen-tilt">
  <g filter="url(#shadow)">
   <rect x="1940" y="50" width="1092" height="710" rx="42" fill="#0D0610"/>
  </g>
  <rect x="1941.5" y="51.5" width="1089" height="707" rx="40.5" fill="none" stroke="#4A2A47" stroke-width="3"/>
  <g clip-path="url(#screen)">
   <rect x="1954" y="64" width="1064" height="682" fill="url(#desktop)"/>
   <!-- the terminal window -->
   <g filter="url(#win-shadow)">
    <rect x="2024" y="130" width="940" height="560" rx="26" fill="#1B0E20"/>
   </g>
   <rect x="2025.5" y="131.5" width="937" height="557" rx="24.5" fill="none" stroke="#5A3157" stroke-width="3" opacity="0.8"/>
   <!-- title bar -->
   <rect x="2025" y="132" width="938" height="72" rx="24" fill="#2A1530"/>
   <rect x="2025" y="180" width="938" height="24" fill="#2A1530"/>
   <circle cx="2066" cy="168" r="10" fill="#FF8FB8"/><circle cx="2098" cy="168" r="10" fill="#E8C15C"/><circle cx="2130" cy="168" r="10" fill="#8CC271"/>
   <rect x="2190" y="144" width="190" height="48" rx="14" fill="#1B0E20"/>
   <text x="2285" y="177" text-anchor="middle" class="tab" fill="#FF8FB8">term</text>
   <text x="2432" y="177" text-anchor="middle" class="tab" fill="#B9A3B6">ai</text>
   <text x="2530" y="177" text-anchor="middle" class="tab" fill="#B9A3B6">web</text>
   <!-- session -->
   <text x="2062" y="268" class="mono" fill="#FF8FB8">~/holzWave</text>
   <text x="2062" y="318" class="mono" fill="#F6EFE6"><tspan fill="#FF8FB8">❯</tspan> wsh ai "why is the pod crashing?"</text>
   <text x="2062" y="378" class="mono" fill="#B9A3B6">reading terminal output…</text>
   <text x="2062" y="428" class="mono" fill="#D9C9D6">OOMKilled: the limit is 128Mi,</text>
   <text x="2062" y="470" class="mono" fill="#D9C9D6">raise it to <tspan fill="#E8C15C">512Mi</tspan> in the deployment.</text>
   <text x="2062" y="548" class="mono" fill="#F6EFE6"><tspan fill="#FF8FB8">❯</tspan> ssh holzkube</text>
   <text x="2062" y="598" class="mono" fill="#8CC271">connected — reconnects when the network drops</text>
   <rect x="2062" y="624" width="16" height="34" rx="3" fill="#FF8FB8"/>
  </g>
 </g>
</svg>
