[package]
name = "holzwave-core"
description = "The shared core of holzWave: terminal engine, PTY and connections"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["ghostty"]
# Terminal engine backed by libghostty-vt. Needs Zig 0.17.1 at build time: the pinned
# Ghostty commit (521cf2c, build.zig.zon version 1.3.2-dev) says minimum_zig_version 0.17.0.
ghostty = ["dep:libghostty-vt", "libghostty-vt/png", "libghostty-vt/allocator_api", "dep:allocator-api2"]
keyring = ["dep:keyring"]

[dependencies]
ammonia = "4"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
chacha20poly1305 = "0.11"
sha2 = "0.11"
zeroize = "1"
getrandom = "0.4"
infer = "0.22"
keyring = { version = "4", optional = true }
# libghostty-rs master (commit of 2026-10-25), pinned; the 0.2.2 on crates.io is older. Needs Zig 0.17.1.
libghostty-vt = { git = "https://github.com/Uzaaft/libghostty-rs", rev = "575ed6b8ceb79ffaf247ecf7e34333876b0d5be4", optional = true }
# The allocator trait that libghostty-vt's `allocator_api` feature takes: core/src/images.rs implements it to bound what one
# terminal may ask the allocator for (a hostile Kitty stream can otherwise make the library hold 400 MiB). Exact version,
# the one libghostty-vt resolves to; the crate is the mirror of the standard library's allocator API (hashbrown and bumpalo
# depend on it).
allocator-api2 = { version = "=0.4.0", optional = true }
portable-pty = "0.9"
nucleo-matcher = "0.3"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
russh = { version = "0.64.1", default-features = false, features = ["flate2", "ring", "rsa"] }
quick-xml = "0.42"
rusqlite = { version = "0.40", features = ["bundled"] }
russh-sftp = "3"
sysinfo = { version = "0.39", default-features = false, features = ["system", "network"] }
serde = { version = "1", features = ["derive"] }
# Layout::from_json parses and validates a user-editable file, so serde_json is a run-time dependency.
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["rustls", "platform-verifier"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util"] }
# Secret redaction of the text that leaves the device (core/src/ai/redact.rs). Matches in time linear in the text and has
# no backreferences or look-around, so hostile terminal output cannot make a pattern backtrack. Default features only;
# it was already in the lock through the Tauri crates.
regex = "1.13.1"
# The HTTP client of the AI chat, behind one chokepoint file (core/src/ai/http.rs). TLS comes from rustls with the ring
# provider passed explicitly and the operating system's trust store, so the lock holds one TLS stack and no C toolchain
# is needed. reqwest's own default features (native TLS, redirects, compression) are off on purpose.
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "stream", "system-proxy"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "0.7.1"
# The reader of GAM's CSV output (core/src/integrate/gam.rs). `print` commands write quoted multi-line cells that hold
# JSON, which a line splitter cannot read, and the text is written by other people into a domain's directory, so the
# parse is done by the established crate and not by a hand-written one; the module only adds caps around it. Pinned to
# the exact current release for the same reason as the other security-relevant crates; it adds csv-core and ryu.
csv = "=1.4.0"

[dev-dependencies]
rand = { version = "0.10", features = ["thread_rng"] }
futures-core = "0.3"
