[package]
name = "holzwave-spawn-helper"
description = "The privileged helper of the holzWave server: the only process that holds file capabilities"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "holzwave_spawn_helper"
path = "src/lib.rs"

[[bin]]
name = "holzwave-spawn-helper"
path = "src/main.rs"

[dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process", "thread", "net", "event"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
