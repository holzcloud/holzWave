# Flatpak manifest of holzWave: a reference for the owner to read, and a build recipe that works offline (scripts/build-flatpak.sh).
#
#   - It is not a submission. The owner writes and submits the Flathub manifest by hand; Flathub does not accept a manifest or a
#     pull request written by an AI agent. holzWave is built with AI help and says so, and no agent opens, prepares or automates a
#     submission to Flathub or touches a repository of Flathub. This file only shows what the build needs.
#   - Unverified until the owner's run: it was built once in a container on arm64 (the architecture of the Docker VM of a Mac)
#     and never started on any desktop. x86_64 is built only by Flathub and is untried here. Flatpak ships in 0.0.1 only if it
#     builds on the owner's Linux machine and the Flatpak rows of docs/test-plan.md (L10 and FPK1 to FPK7) pass. See docs/flatpak.md
#     for the permissions and docs/flathub-submission.md for the steps that are the owner's.
#
# No build step has network access. Every source is declared and pinned by content: the Zig compiler (two archives, a sha256
# each), the Ghostty checkout (a git source at one commit), the Zig packages of the terminal engine (generated/zig-sources.json),
# the Cargo crates (generated/cargo-sources.json) and the npm packages (generated/node-sources.json). The three JSON files are
# tool output: do not edit them, regenerate them with scripts/flatpak-zig-sources.sh and scripts/flatpak-generate-sources.sh.
# The only network permission below is the one the running app asks for.
#
# Runtime: the newest stable GNOME runtime of Flathub when this was written (org.gnome.Platform and org.gnome.Sdk 51,
# on org.freedesktop 26.08), with the Rust and the Node SDK extensions of that freedesktop version. Sources: `flatpak
# remote-ls --runtime flathub` and the Flathub API (flathub.org/api/v2/appstream/org.gnome.Platform) on 2026-10-12.
app-id: ch.holzcloud.holzwave
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
  - org.freedesktop.Sdk.Extension.node26
command: holzwave-app

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  # The network, for the app itself: a pane that runs in the sandbox has it too, and a pane that runs on the host has the host's
  # network anyway. The SSH connections you start, the sync you set up and the AI chat (when you send a message to a provider
  # you set up) need it, and a model server on this computer is reached through it. Nothing connects at launch on a fresh
  # install. Flatpak has no narrower network permission (no rule per host or per port), so the sandbox does not limit what is
  # contacted: the app's own rules do (saved addresses only, Local only, consent per pane). docs/flatpak.md lists when
  # holzWave connects and how to take this away again: flatpak override --user --unshare=network ch.holzcloud.holzwave
  - --share=network
  - --device=dri
  # The home folder is open, so that `~`, the directories of panes and "reveal in the file manager" resolve to the real ones,
  # also in a pane that runs in the sandbox. The host permission below already lets the app do anything this one allows, so
  # this costs nothing more.
  - --filesystem=home
  # SANDBOX ESCAPE BY DESIGN. This permission lets the app run any command on the host with the user's rights
  # (`flatpak-spawn --host`). A terminal in a sandbox sees only the runtime's /bin/sh and none of the user's tools, so it
  # cannot be very useful without it. It is shipped, but panes start in the sandbox by default: the app setting `Host shell`
  # (off by default, never synced to another computer, shown only in a Flatpak) is the person's choice to start panes on the
  # host instead. The only host command holzWave then starts is the user's login shell (or the program of the `shell`
  # setting). The setting cannot grant this permission, only use it; if a Flatpak tool revokes it the setting reads `not
  # available`. While the permission is present the sandbox does not protect the rest of the system from this app, whatever
  # the setting says. The integrations (Kubernetes, Talos, Azure CLI, GAM7) do not run in a Flatpak at all. The metainfo
  # description and docs/flatpak.md say so too. If reviewers do not accept this permission, docs/flathub-submission.md lists
  # the fallbacks.
  - --talk-name=org.freedesktop.Flatpak
  # The SSH agent. The in-process SSH client finds the agent of the user through SSH_AUTH_SOCK, as `ssh` does; with this socket
  # a Flatpak gets the host's agent forwarded into the sandbox and sets that variable. Without it a connection that signs in
  # with an agent key fails with "no ssh-agent is running". It costs no extra sandbox: the host permission above already
  # removes it, which is why a reviewer will ask about that one first.
  - --socket=ssh-auth
  # The keychain. The passwords, passphrases and provider keys of SSH, sync and the AI chat are kept in the system keychain,
  # which on Linux is the Secret Service (org.freedesktop.secrets) on the session bus. holzWave talks to it directly, and that
  # name is not covered by the Secret portal, so the sandbox must be allowed to talk to it. Without it saving a secret
  # fails, and the app does not fall back to a file. It costs no extra sandbox: the host permission above already removes it.
  - --talk-name=org.freedesktop.secrets

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin:/usr/lib/sdk/node26/bin
  env:
    # Everything the build writes stays in the build directory, nothing in the user's home. The declared sources are laid out
    # below these folders: the crates and the cargo configuration of cargo-sources.json in `cargo`, the npm packages of
    # node-sources.json in the npm cache below `flatpak-node`, which is what `npm ci --offline` reads.
    CARGO_HOME: /run/build/holzwave/cargo
    CARGO_NET_OFFLINE: 'true'
    npm_config_cache: /run/build/holzwave/flatpak-node/npm-cache
    XDG_CACHE_HOME: /run/build/holzwave/flatpak-node/cache
    ZIG_GLOBAL_CACHE_DIR: /run/build/holzwave/.zig-cache

modules:
  # Zig exactly 0.17.0, which the Ghostty engine is built with (the pinned Ghostty commit requires it). A build tool
  # only: nothing of it stays in the app. One archive per architecture; the checksums are those of
  # https://ziglang.org/download/index.json, and both were also computed over the downloaded archives. The aarch64
  # archive lets the same manifest build on an ARM machine (for 0.0.1 only x86_64 is a target).
  - name: zig
    buildsystem: simple
    build-commands:
      - mkdir -p /app/opt/zig
      - cp -a . /app/opt/zig
    cleanup:
      - /opt/zig
    sources:
      - type: archive
        url: https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
        sha256: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
        only-arches: [x86_64]
      - type: archive
        url: https://ziglang.org/download/0.17.0/zig-aarch64-linux-0.17.0.tar.xz
        sha256: 9e8d11661d4ae3bd57702a3832781e23ad151dde5798e16a5ccd503f65234ff8
        only-arches: [aarch64]

  # holzWave itself, inside the SDK: a binary built outside the runtime could be ABI-incompatible with it. The build step has
  # no network. The terminal engine (libghostty-vt) is built by Zig from the Ghostty checkout below, with the Zig packages of
  # zig-sources.json as its only dependencies (GHOSTTY_ZIG_SYSTEM_DIR); Cargo reads its crates from the vendor folder that
  # cargo-sources.json lays out; npm reads its packages from the cache that node-sources.json lays out. The page is built with
  # `npm run build` and the app with the one cargo command of generated/app-build-command.txt (it is the command the Tauri CLI
  # runs for a release build, without the CLI, and it embeds the page: it is not a development build).
  - name: holzwave
    buildsystem: simple
    build-options:
      append-path: /app/opt/zig
      env:
        # The Ghostty checkout is writable: Zig unpacks its packages into it.
        GHOSTTY_SOURCE_DIR: /run/build/holzwave/ghostty
        GHOSTTY_ZIG_SYSTEM_DIR: /run/build/holzwave/zig-pkgs
        ZIG: /app/opt/zig/zig
    sources:
      # LOCAL RECIPE ONLY: this is the working tree of the repository, so that the recipe builds what is on disk. It is the one
      # `dir` source of the manifest. For a submission the owner replaces it with a `git` source of this repository whose `tag`
      # and `commit` fields name a release; no tag or commit is written here because none exists yet.
      - type: dir
        path: ../..
        skip:
          - .git
          - .planning
          - target
          - node_modules
          - dist
          - .flatpak-builder
          - flatpak-build
          - flatpak-repo
      # The Ghostty source that the engine crate pins (generated/ghostty-pin.txt): one commit, no branch.
      - type: git
        url: https://github.com/ghostty-org/ghostty.git
        commit: 521cf2c5d30bd48028ca61546c64e7913764073d
        dest: ghostty
      # Tool output, see the header: the Zig packages, the Cargo crates and git dependency, the npm packages.
      - generated/zig-sources.json
      - generated/cargo-sources.json
      - generated/node-sources.json
    build-commands:
      - npm --prefix app ci --offline --ignore-scripts --no-audit --no-fund
      - npm --prefix app run build
      - cargo build --locked --bins --features tauri/custom-protocol --release --offline -p holzwave-app
      - install -Dm755 target/release/holzwave-app /app/bin/holzwave-app
      - install -Dm644 packaging/flatpak/ch.holzcloud.holzwave.desktop /app/share/applications/ch.holzcloud.holzwave.desktop
      - install -Dm644 packaging/flatpak/ch.holzcloud.holzwave.metainfo.xml /app/share/metainfo/ch.holzcloud.holzwave.metainfo.xml
      - install -Dm644 app/src-tauri/icons/32x32.png /app/share/icons/hicolor/32x32/apps/ch.holzcloud.holzwave.png
      - install -Dm644 app/src-tauri/icons/128x128.png /app/share/icons/hicolor/128x128/apps/ch.holzcloud.holzwave.png
      - install -Dm644 app/src-tauri/icons/128x128@2x.png /app/share/icons/hicolor/256x256/apps/ch.holzcloud.holzwave.png
      - install -Dm644 app/src-tauri/icons/icon.png /app/share/icons/hicolor/512x512/apps/ch.holzcloud.holzwave.png
