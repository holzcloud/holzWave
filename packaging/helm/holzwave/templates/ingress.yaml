{{- if and .Values.ingress.enabled (eq (include "holzwave.mode" .) "proxy") }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "holzwave.fullname" . }}
  labels:
    {{- include "holzwave.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . | quote }}
  {{- end }}
  {{- if .Values.ingress.tlsSecretName }}
  tls:
    - hosts:
        - {{ required "ingress.host is required when the Ingress is enabled" .Values.ingress.host | quote }}
      secretName: {{ .Values.ingress.tlsSecretName | quote }}
  {{- end }}
  rules:
    - host: {{ required "ingress.host is required when the Ingress is enabled" .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "holzwave.fullname" . }}
                port:
                  number: {{ .Values.service.port }}
{{- end }}
