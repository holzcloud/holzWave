<title>holzWave Designvorschläge</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Manrope:wght@400;600;700&display=swap">
<style>
/* Layout: Kopfzeile mit OS-Umschalter, danach ein Raster aus 10 Mockup-Karten (2 Spalten, 1 auf dem Handy) */
:root{
  --ground:#14091A; --ground2:#1D0F26; --pane:#1B0E20; --edge:#3A2144;
  --ink:#F6EFE6; --ink2:rgba(246,239,230,.7); --ink3:#9C8EA0;
  --rose:#FF8FB8; --rose-deep:#C23B72; --wash:rgba(255,143,184,.14); --cream:#FFE6F0;
  --wood:#C98B4F; --ok:#8CC271; --warn:#E8C15C; --danger:#EC8272; --info:#8FB8D8;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace; --sans:'Manrope',system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:14px/1.5 var(--sans);padding-block:24px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
header{display:flex;flex-wrap:wrap;gap:16px;align-items:end;justify-content:space-between}
h1{font:700 22px/1.2 var(--mono);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1 b{color:var(--rose)}
header p{margin:6px 0 0;color:var(--ink2);max-width:62ch}
.seg{display:flex;border:1px solid var(--edge);border-radius:8px;overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 14px;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink3)}
.seg button[aria-pressed=true]{background:var(--wash);color:var(--rose);box-shadow:inset 0 -2px var(--rose)}
.seg button:focus-visible{outline:2px solid var(--rose);outline-offset:-2px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:32px 24px}
@media(max-width:900px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{display:flex;flex-direction:column;gap:10px;min-width:0}
.card h2{font:700 13px var(--mono);letter-spacing:.1em;text-transform:uppercase;margin:0;display:flex;gap:10px;align-items:baseline}
.card h2 i{font-style:normal;color:var(--rose)}
.card p{margin:0;color:var(--ink2);font-size:13px;max-width:70ch}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font:500 10px var(--mono);letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--edge);color:var(--ink3);padding:2px 8px;border-radius:999px}

/* ---------- Mockup-Basis ---------- */
.m{position:relative;height:360px;background:var(--ground);border:1px solid var(--edge);border-radius:10px;overflow:hidden;
  font:400 11px/1.55 var(--mono);color:var(--ink);display:flex;flex-direction:column;min-width:0}
.m *{min-width:0}
.dim{color:var(--ink3)} .ro{color:var(--rose)} .ok{color:var(--ok)} .wa{color:var(--warn)} .er{color:var(--danger)} .in{color:var(--info)}
.lbl{font-weight:500;letter-spacing:.1em;text-transform:uppercase;font-size:10px}
.row{display:flex;align-items:center}
.fill{flex:1;min-height:0;min-width:0}
.term{padding:8px 10px;white-space:pre;overflow:hidden}
.cur{display:inline-block;width:.6em;height:1.1em;background:var(--rose);vertical-align:-2px}
/* Fensterknöpfe pro OS */
.wc{display:flex;gap:6px;align-items:center;padding:0 10px;flex:none}
.wc .d{width:10px;height:10px;border-radius:50%;background:var(--edge)}
.wc.mac .d:nth-child(1){background:#EC8272}.wc.mac .d:nth-child(2){background:#E8C15C}.wc.mac .d:nth-child(3){background:#8CC271}
.wc.win,.wc.lin{display:none;gap:0;padding:0}
.wc.win span{width:34px;text-align:center;color:var(--ink3);font-size:11px;line-height:28px}
.wc.lin span{width:18px;height:18px;border-radius:50%;background:var(--wash);color:var(--ink2);text-align:center;font-size:10px;line-height:18px;margin-right:6px}
[data-os=win] .wc.mac,[data-os=lin] .wc.mac{display:none}
[data-os=win] .wc.win{display:flex}[data-os=lin] .wc.lin{display:flex}
[data-os=win] .wc.mac,[data-os=lin] .wc.mac{display:none}
.right-wc{margin-left:auto}
[data-os=mac] .right-wc{display:none}
[data-os=win] .left-wc,[data-os=lin] .left-wc{display:none}
.bar{height:28px;background:var(--ground2);border-bottom:1px solid var(--edge);flex:none}
.tab{padding:0 12px;height:100%;display:flex;align-items:center;gap:6px;color:var(--ink3);border-right:1px solid var(--edge);white-space:nowrap}
.tab.on{color:var(--ink);background:var(--wash);box-shadow:inset 0 -2px var(--rose)}
.status{height:22px;border-top:1px solid var(--edge);background:var(--ground2);flex:none;font-size:10px}
.status span{padding:0 10px;color:var(--ink3);letter-spacing:.1em;text-transform:uppercase;height:100%;display:flex;align-items:center}
.status span.on{background:var(--rose-deep);color:#fff}
.ph{height:22px;padding:0 10px;gap:8px;border-bottom:1px solid var(--edge);flex:none}
.ph .dot{width:6px;height:6px;border-radius:50%;background:var(--ok)}
.ph .ctx{margin-left:auto;color:var(--ink3)}
.pane{display:flex;flex-direction:column;background:var(--pane);border-right:1px solid var(--edge)}
.pane.f .ph{box-shadow:inset 0 1px var(--rose)}
.kbd{border:1px solid var(--edge);border-radius:4px;padding:0 5px;color:var(--ink3);font-size:10px}
.ico{width:28px;height:28px;display:grid;place-items:center;color:var(--ink3);font-size:13px}
.ico.on{color:var(--rose);box-shadow:inset 2px 0 var(--rose);background:var(--wash)}
.pal{position:absolute;left:50%;top:44px;transform:translateX(-50%);width:min(300px,80%);background:var(--ground2);border:1px solid var(--edge);border-radius:8px;box-shadow:0 12px 32px rgba(0,0,0,.55);z-index:4}
.pal .q{padding:8px 10px;border-bottom:1px solid var(--edge)}
.pal .it{padding:4px 10px;display:flex;justify-content:space-between;color:var(--ink2)}
.pal .it.on{background:var(--wash);box-shadow:inset 2px 0 var(--rose);color:var(--ink)}
/* V6 Karten */
.cards{padding:8px;gap:8px;display:grid;grid-template-columns:1.2fr 1fr;grid-template-rows:1fr 1fr}
.cards .pane{border:1px solid var(--edge);border-radius:14px;overflow:hidden}
.cards .pane.f{border-color:var(--rose)}
.cards .big{grid-row:span 2}
/* V8 Blöcke */
.blk{margin:6px 8px;border:1px solid var(--edge);border-radius:8px;background:var(--pane)}
.blk .h{padding:3px 10px;border-bottom:1px solid var(--edge);display:flex;gap:8px;color:var(--ink3)}
.blk .h .t{margin-left:auto}
.blk.err{border-color:var(--danger)}
/* V9 TUI */
.tui{padding:6px;gap:6px;display:grid;grid-template-columns:1.3fr 1fr;grid-template-rows:1fr 1fr}
.tb{position:relative;border:1px solid var(--edge);padding:10px 8px 4px;white-space:pre;overflow:hidden;background:var(--ground)}
.tb::before{content:attr(data-t);position:absolute;top:-8px;left:8px;background:var(--ground);padding:0 6px;color:var(--ink3);font-size:10px;letter-spacing:.1em;text-transform:uppercase;line-height:14px}
.tb.f{border-color:var(--rose)}.tb.f::before{color:var(--rose)}
.tb.dbl{border-style:double;border-width:3px}
.tb.big{grid-row:span 2}
/* V5 Powerline */
.pl{display:flex;height:22px;font-size:10px;font-weight:700;flex:none}
.pl span{padding:0 12px 0 14px;display:flex;align-items:center;clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%,8px 50%);margin-left:-6px;letter-spacing:.06em;text-transform:uppercase}
.pl span:first-child{clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%);margin-left:0;padding-left:10px}
.pl .a{background:var(--rose-deep);color:#fff}.pl .b{background:var(--edge);color:var(--ink)}.pl .c{background:var(--ground2);color:var(--ink3)}
/* V10 Handy */
.pair{display:flex;gap:12px;height:100%;padding:12px;align-items:stretch;background:var(--ground2)}
.pair .m{height:auto}
.phone{width:150px;flex:none;border-radius:16px}
.accessory{display:flex;gap:3px;padding:4px;background:var(--ground2);border-top:1px solid var(--edge);flex:none}
.accessory span{flex:1;text-align:center;border:1px solid var(--edge);border-radius:6px;padding:6px 0;color:var(--ink2);font-size:9px}
.bnav{display:flex;border-top:1px solid var(--edge);background:var(--ground2);flex:none}
.bnav span{flex:1;text-align:center;padding:6px 0;color:var(--ink3);font-size:9px}
.bnav span.on{color:var(--rose);box-shadow:inset 0 2px var(--rose)}
.rail{width:36px;background:var(--ground2);border-right:1px solid var(--edge);flex:none;display:flex;flex-direction:column;align-items:center;padding:6px 0;gap:4px}
.side{width:150px;background:var(--ground2);border-right:1px solid var(--edge);flex:none;padding:8px 0;overflow:hidden;white-space:nowrap}
.side div{padding:2px 10px;color:var(--ink2)}
.side .h{color:var(--ink3);margin-top:8px}
.side .on{background:var(--wash);color:var(--rose);box-shadow:inset 2px 0 var(--rose)}
.side .sub{padding-left:22px}
.side .sub2{padding-left:34px;color:var(--ink3)}
.wood{height:3px;background:linear-gradient(90deg,var(--wood),#E0A869 60%,var(--wood));flex:none}
@media (prefers-reduced-motion:no-preference){.cur{animation:b 1.06s steps(1) infinite}@keyframes b{50%{opacity:0}}}
</style>

<div class="wrap" id="root" data-os="mac">
  <header>
    <div>
      <h1>holzWave <b>/</b> 10 Designvorschläge</h1>
      <p>Alle nutzen die Tokens aus <code>docs/design.md</code>: Aubergine, Rose, Holzplanke, JetBrains Mono. Gleiche Chrome-Zeichnung auf jeder Plattform, nur die Fensterknöpfe folgen dem System. Umschalter anwenden.</p>
    </div>
    <div class="seg" role="group" aria-label="Plattform">
      <button aria-pressed="true" data-os="mac">macOS</button>
      <button aria-pressed="false" data-os="win">Windows</button>
      <button aria-pressed="false" data-os="lin">Linux</button>
    </div>
  </header>
  <div class="grid" id="grid"></div>
</div>

<script>
const wcL='<div class="wc mac left-wc"><i class="d"></i><i class="d"></i><i class="d"></i></div>';
const wcR='<div class="wc win right-wc"><span>&#8211;</span><span>&#9633;</span><span>&#10005;</span></div><div class="wc lin right-wc"><span>&#8211;</span><span>&#9633;</span><span>&#10005;</span></div>';
const sh=`<span class="ro">❯</span> cargo test -p holzwave-core
<span class="dim">   Compiling holzwave-core v0.0.1</span>
test layout::focus_cycles ... <span class="ok">ok</span>
test unicode_wide_chars ... <span class="ok">ok</span>
test scrollback ... <span class="ok">ok</span>
test result: <span class="ok">ok</span>. 14 passed

<span class="ro">❯</span> git log --oneline | head -3
<span class="wa">e883222</span> fix(release): Windows cross
<span class="wa">7af9cc8</span> Casks: preview alpha2
<span class="ro">❯</span> <span class="cur"></span>`;
const kube=`<span class="ro">❯</span> kubectl get nodes
NAME      STATUS   ROLES
talos-1   <span class="ok">Ready</span>    control-plane
talos-2   <span class="ok">Ready</span>    worker
talos-3   <span class="wa">NotReady</span> worker`;
const md=`<span class="ro"># Phase 2</span>
Key encoder, Themes
<span class="dim">-</span> Pane schließen beendet Shell
<span class="dim">-</span> Layout überlebt Neustart`;
const pal=`<div class="pal"><div class="q"><span class="ro">❯</span> split<span class="cur"></span></div>
<div class="it on"><span>Split pane right</span><span class="kbd">⌘D</span></div>
<div class="it"><span>Split pane down</span><span class="kbd">⇧⌘D</span></div>
<div class="it"><span>Connect: holzkube</span><span class="kbd">ssh</span></div></div>`;
const P=(t,c,b,f)=>`<div class="pane fill ${f?'f':''}"><div class="ph row"><i class="dot"></i><span class="lbl">${t}</span><span class="ctx">${c}</span></div><div class="term fill">${b}</div></div>`;
const tabs=(a)=>['1 shell','2 holzkube','3 notes.md'].map((t,i)=>`<div class="tab ${i==a?'on':''}">${t}</div>`).join('')+'<div class="tab dim">+</div>';

const V=[
{n:'Haarlinie+',t:'Weiterentwicklung des Beschlossenen',d:'Das aktuelle Fenster, verfeinert: Zeilen-Tabs, Pane-Header mit Statuspunkt, tmux-Statuszeile. Geringstes Risiko.',tags:['Dichte hoch','Nativ: mittel','Bestehende Basis'],
 h:`<div class="bar row">${wcL}<div class="tab on" style="box-shadow:none;color:var(--rose)">◆ MAIN</div>${tabs(0)}<span class="fill"></span><span class="dim" style="padding-right:10px">~/holzWave · 14:32</span>${wcR}</div>
 <div class="row fill">${P('Shell','pane 1 · local',sh,1)}<div class="fill" style="display:flex;flex-direction:column">${P('holzkube','ssh · talos',kube)}${P('notes.md','preview',md)}</div></div>
 <div class="status row"><span class="on">MAIN</span><span>3 panes</span><span>webgl2</span><span style="margin-left:auto">utf-8</span><span>0.0.1-alpha2</span></div>${pal}`},
{n:'Seitenleiste',t:'Workspace-Rail links',d:'Schmale Icon-Rail für Workspaces, oben nur Tabs des aktiven Workspace. Gut für viele Workspaces.',tags:['Dichte mittel','Nativ: hoch (wie Finder/Explorer)','Viele Workspaces'],
 h:`<div class="bar row">${wcL}<span class="dim lbl" style="padding:0 10px">holzWave</span>${tabs(0)}<span class="fill"></span>${wcR}</div>
 <div class="row fill"><div class="rail"><div class="ico on">M</div><div class="ico">K</div><div class="ico">D</div><div class="ico" style="margin-top:auto">⚙</div></div>
 ${P('Shell','local',sh,1)}${P('holzkube','ssh · talos',kube)}</div>
 <div class="status row"><span class="on">MAIN</span><span>2 panes</span><span style="margin-left:auto">⌘K palette</span></div>`},
{n:'Baumansicht',t:'Workspaces, Tabs und Panes als Baum',d:'Vertikale Übersicht wie ein Dateibaum: jede Sitzung, jeder Host, jede Pane auf einen Blick. Für Power-User mit vielen SSH-Sitzungen.',tags:['Übersicht sehr hoch','Nativ: hoch','Breiter'],
 h:`<div class="bar row">${wcL}<span class="fill dim" style="text-align:center">holzWave</span>${wcR}</div>
 <div class="row fill"><div class="side"><div class="lbl h">Workspaces</div><div class="on">◆ main</div><div class="sub">1 shell</div><div class="sub2">▸ pane local</div><div class="sub">2 holzkube</div><div class="sub2"><span class="ok">●</span> ssh talos</div><div>◇ infra</div><div class="lbl h">Hosts</div><div><span class="ok">●</span> talos-1</div><div><span class="wa">●</span> nas</div></div>
 ${P('Shell','pane 1 · local',sh,1)}${P('holzkube','ssh · talos',kube)}</div>
 <div class="status row"><span class="on">MAIN</span><span>3 panes</span><span>2 ssh</span></div>`},
{n:'Nur Palette',t:'Command-first, Chrome versteckt sich',d:'Kein Tab-Streifen im Alltag. Alles über ⌘K, Tabs erscheinen mit Modifier. Maximaler Platz für das Terminal.',tags:['Dichte niedrig','Nativ: niedrig','Fokus'],
 h:`<div class="bar row" style="height:20px;background:var(--ground);border:0">${wcL}<span class="fill"></span><span class="dim" style="padding-right:10px">main · 1/3 · <span class="kbd">⌘K</span></span>${wcR}</div>
 <div class="row fill"><div class="fill" style="display:flex;flex-direction:column">${P('Shell','local',sh,1)}</div>${P('holzkube','ssh',kube)}</div>${pal}`},
{n:'Powerline',t:'Segmentierte Statuszeile als Hauptnavigation',d:'tmux/Powerline-Pfeilsegmente unten und oben. Sehr nerdig, jede Information ist ein Segment, jedes Segment ist klickbar.',tags:['Dichte hoch','Nativ: niedrig','Max. Nerd'],
 h:`<div class="bar row" style="background:var(--ground)">${wcL}<div class="pl"><span class="a">◆ main</span><span class="b">1 shell</span><span class="c">2 holzkube</span><span class="c">3 notes</span></div><span class="fill"></span>${wcR}</div>
 <div class="row fill">${P('Shell','local',sh,1)}<div class="fill" style="display:flex;flex-direction:column">${P('holzkube','ssh',kube)}${P('notes.md','preview',md)}</div></div>
 <div class="pl" style="height:22px;background:var(--ground2)"><span class="a">main</span><span class="b">~/holzWave</span><span class="c">3 panes</span><span class="c">webgl2</span><span class="c" style="margin-left:auto">⎇ main</span><span class="b">alpha2</span></div>`},
{n:'Karten',t:'Schwebende Panes mit 16 px Radius',d:'Panes als Karten auf dunklem Grund, Fokus als Rose-Rahmen. Weicher und moderner, braucht etwas mehr Platz.',tags:['Dichte mittel','Nativ: mittel','Modern'],
 h:`<div class="bar row" style="background:var(--ground);border:0">${wcL}${tabs(0)}<span class="fill"></span>${wcR}</div>
 <div class="cards fill"><div class="pane big f"><div class="ph row"><i class="dot"></i><span class="lbl">Shell</span><span class="ctx">local</span></div><div class="term fill">${sh}</div></div>
 <div class="pane"><div class="ph row"><i class="dot"></i><span class="lbl">holzkube</span><span class="ctx">ssh</span></div><div class="term fill">${kube}</div></div>
 <div class="pane"><div class="ph row"><i class="dot" style="background:var(--info)"></i><span class="lbl">notes.md</span><span class="ctx">preview</span></div><div class="term fill">${md}</div></div></div>
 <div class="status row"><span class="on">MAIN</span><span>3 panes</span></div>`},
{n:'Activity Bar',t:'IDE-artig: Sitzungen, SSH, Dateien, Sync',d:'Icon-Leiste links schaltet ein Seitenpanel (Sitzungen, Hosts, Dateivorschau, Nextcloud-Sync). Deckt alle geplanten Funktionen ab.',tags:['Funktionsumfang max.','Nativ: hoch','Breiter'],
 h:`<div class="bar row">${wcL}${tabs(0)}<span class="fill"></span>${wcR}</div>
 <div class="row fill"><div class="rail"><div class="ico on">▤</div><div class="ico">⇄</div><div class="ico">▣</div><div class="ico">☁</div></div>
 <div class="side" style="width:120px"><div class="lbl h">Hosts</div><div><span class="ok">●</span> talos-1</div><div><span class="ok">●</span> talos-2</div><div><span class="er">●</span> nas</div><div class="lbl h">Sync</div><div class="ok">✓ Nextcloud</div></div>
 ${P('Shell','local',sh,1)}</div>
 <div class="status row"><span class="on">MAIN</span><span>☁ synced</span><span style="margin-left:auto">ssh 2</span></div>`},
{n:'Blöcke',t:'Befehle als Blöcke mit Status und Dauer',d:'Jeder Befehl ist ein Block mit Exit-Code, Dauer und Aktionen (kopieren, wiederholen). Fehler fallen sofort durch roten Rand auf.',tags:['Übersicht sehr hoch','Nativ: mittel','Wave-nah'],
 h:`<div class="bar row">${wcL}${tabs(0)}<span class="fill"></span>${wcR}</div>
 <div class="fill" style="overflow:hidden"><div class="blk"><div class="h"><span class="ok">✓ 0</span><span>cargo test</span><span class="t">2.4s</span></div><div class="term" style="padding:4px 10px">test result: <span class="ok">ok</span>. 14 passed</div></div>
 <div class="blk err"><div class="h"><span class="er">✗ 1</span><span>npm run build</span><span class="t">8.1s</span></div><div class="term" style="padding:4px 10px"><span class="er">error</span> TS2322 in chrome.ts:41</div></div>
 <div class="blk"><div class="h"><span class="ok">✓ 0</span><span>git log -3</span><span class="t">0.1s</span></div><div class="term" style="padding:4px 10px"><span class="wa">e883222</span> fix(release)…</div></div>
 <div class="term"><span class="ro">❯</span> <span class="cur"></span></div></div>
 <div class="status row"><span class="on">MAIN</span><span>3 blocks</span><span style="margin-left:auto">last 2.4s</span></div>`},
{n:'TUI-Rahmen',t:'Rahmen und Titel wie btop oder lazygit',d:'Panes mit Titel im Rahmen, Doppelrand für den Fokus. Wirkt wie eine Terminal-App und bleibt auf jeder Plattform gleich.',tags:['Dichte hoch','Nativ: niedrig','Max. Nerd'],
 h:`<div class="bar row" style="background:var(--ground)">${wcL}<span class="fill dim" style="text-align:center">holzWave [main]</span>${wcR}</div>
 <div class="tui fill"><div class="tb f big dbl" data-t="1 shell · local">${sh}</div><div class="tb" data-t="2 holzkube · ssh">${kube}</div><div class="tb" data-t="3 notes.md">${md}</div></div>
 <div class="status row"><span class="on">MAIN</span><span>⌘K</span><span style="margin-left:auto">alpha2</span></div>`},
{n:'Planke',t:'Logo-Planke als Unterkante',d:'Wie Haarlinie+, aber die Holzplanke aus dem Logo trägt die Statuszeile und den aktiven Workspace. Der einzige Warm-Akzent, bleibt wiedererkennbar.',tags:['Dichte hoch','Nativ: mittel','Markenstark'],
 h:`<div class="bar row">${wcL}<div class="tab on" style="box-shadow:none;color:var(--rose)">◆ MAIN</div>${tabs(0)}<span class="fill"></span>${wcR}</div>
 <div class="row fill">${P('Shell','local',sh,1)}<div class="fill" style="display:flex;flex-direction:column">${P('holzkube','ssh · talos',kube)}${P('notes.md','preview',md)}</div></div>
 <div class="wood"></div><div class="status row" style="background:linear-gradient(var(--ground2),var(--ground))"><span class="on" style="background:var(--wood);color:#1B0E20">MAIN</span><span>3 panes</span><span style="margin-left:auto">0.0.1-alpha2</span></div>`},
];
const phone=`<div class="m phone"><div class="bar row" style="height:22px"><span class="dim" style="padding:0 8px">◆ main · 1 shell</span></div><div class="term fill" style="font-size:9px">${sh.split('\n').slice(0,8).join('\n')}</div><div class="accessory"><span>esc</span><span>tab</span><span>ctrl</span><span>↑</span></div><div class="bnav"><span class="on">shell</span><span>kube</span><span>notes</span><span>+</span></div></div>`;
const g=document.getElementById('grid');
